plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version "${minotaur_version}"
}

base {
	archivesName = 'rpg-gear-upgrades'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'Bawnorton'
		url = 'https://maven.bawnorton.com/releases'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mythic_rpg_compat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Lets us inject into Mythic Upgrades' own mixin handlers
	include implementation("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixinsquared_version}")
	annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixinsquared_version}"

	// Mythic Upgrades: optional. -PnoMythic leaves it out of the dev client to test that.
	compileOnly "maven.modrinth:mythic-upgrades:${project.mythicupgrades_version}"
	if (!providers.gradleProperty("noMythic").isPresent()) {
		localRuntime "maven.modrinth:mythic-upgrades:${project.mythicupgrades_version}"
	}
	compileOnly "maven.modrinth:armor-model-api:${project.armor_model_api_version}"
	localRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"

	// Optional: config screen in Mod Menu, built with Cloth Config
	compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:armor-model-api:${project.armor_model_api_version}"

	// Optional: Jewelry gem sockets (extra socket on first infusion)
	compileOnly "maven.modrinth:jewelry:${project.jewelry_version}"
	localRuntime "maven.modrinth:jewelry:${project.jewelry_version}"

	// Spell Engine: optional, used to tell direct spell hits from splash for gem procs
	compileOnly "maven.modrinth:spell-engine:${project.spell_engine_version}"
	compileOnly "maven.modrinth:spell-power:${project.spell_power_version}"

	// Better End / Better Nether: only referenced by id, present in the dev client for testing
	localRuntime "maven.modrinth:betterend:${project.betterend_version}"
	localRuntime "maven.modrinth:betternether:${project.betternether_version}"
	localRuntime "maven.modrinth:bclib:${project.bclib_version}"
	localRuntime "maven.modrinth:worldweaver:${project.worldweaver_version}"
	localRuntime "maven.modrinth:wunderlib:${project.wunderlib_version}"

	// RPG Series: only referenced by id, present in the dev client for testing
	localRuntime "maven.modrinth:archers:${project.archers_version}"
	localRuntime "maven.modrinth:paladins-and-priests:${project.paladins_version}"
	localRuntime "maven.modrinth:wizards:${project.wizards_version}"
	localRuntime "maven.modrinth:rogues-and-warriors:${project.rogues_version}"
	localRuntime "maven.modrinth:spell-engine:${project.spell_engine_version}"
	localRuntime "maven.modrinth:spell-power:${project.spell_power_version}"
	localRuntime "maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}"
	localRuntime "maven.modrinth:runes:${project.runes_version}"
	localRuntime "maven.modrinth:structure-pool-api:${project.structure_pool_api_version}"
	localRuntime "maven.modrinth:bundle-api:${project.bundle_api_version}"
	localRuntime "maven.modrinth:player-animation-library:${project.player_animation_library_version}"
	localRuntime "maven.modrinth:rei:${project.rei_version}"
	localRuntime "maven.modrinth:architectury-api:${project.architectury_version}"
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mythic_rpg_compat_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true // By setting this to true, you agree to the Minecraft EULA.
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Publishing: ./gradlew modrinth (upload version), ./gradlew modrinthSyncBody (description).
// Token from $MODRINTH_TOKEN or ~/.config/modrinth-token.
def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(
		providers.fileContents(layout.projectDirectory.file(
				"${System.getProperty('user.home')}/.config/modrinth-token")).asText.map { it.trim() })

// The section of CHANGELOG.md for the current version.
def currentChangelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText.map { text ->
	def section = text.split(/(?m)^## /).find { it.startsWith("${project.version}\n") || it.startsWith("${project.version}\r") }
	section ? section.substring(section.indexOf('\n') + 1).trim() : ""
}

modrinth {
	token = modrinthToken
	// ./gradlew modrinth -PmodrinthDryRun prints the upload instead of sending it
	debugMode = providers.gradleProperty("modrinthDryRun").isPresent()
	projectId = "rpg-gear-upgrades"
	versionNumber = project.version
	versionName = "${project.version}"
	versionType = "release"
	uploadFile = jar
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = currentChangelog
	syncBodyFrom = providers.fileContents(layout.projectDirectory.file("docs/MODRINTH.md")).asText
	dependencies {
		required.project "fabric-api"
		required.project "armor-model-api"
		optional.project "archers"
		optional.project "paladins-and-priests"
		optional.project "wizards"
		optional.project "rogues-and-warriors"
		optional.project "mythic-upgrades"
		optional.project "betterend"
		optional.project "betternether"
		optional.project "jewelry"
	}
}

// Minotaur reads Task.project at execution time
tasks.named("modrinth") { notCompatibleWithConfigurationCache("Minotaur uses Task.project") }
tasks.named("modrinthSyncBody") { notCompatibleWithConfigurationCache("Minotaur uses Task.project") }

// Better End's library (wover) shows a welcome screen on first launch, which would leave client
// gametests stuck off the title screen. Mark it as already shown in the test run directory.
def woverClientConfig = layout.buildDirectory.file("run/clientGameTest/config/wover/client.json")
def gameTestOptions = layout.buildDirectory.file("run/clientGameTest/options.txt")
tasks.named("runClientGameTest") {
	doFirst {
		def file = woverClientConfig.get().asFile
		file.parentFile.mkdirs()
		file.text = '{"internal":{"did_present_welcome_screen":true},"loading":{"disable_experimental_warning":true}}\n'

		// Mute the game during test runs.
		def options = gameTestOptions.get().asFile
		def lines = options.exists() ? options.readLines().findAll { !it.startsWith("soundCategory_master:") } : []
		options.text = (lines + "soundCategory_master:0.0").join("\n") + "\n"
	}
}
